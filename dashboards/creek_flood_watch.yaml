# Lovelace dashboard — Ackerly Creek Flood Watch (spec Addendum B, Layer 3).
#
# Register it in configuration.yaml:
#   lovelace:
#     mode: storage            # keep your other dashboards on the UI editor
#     dashboards:
#       creek-flood-watch:
#         mode: yaml
#         title: Creek Flood Watch
#         icon: mdi:water-alert
#         show_in_sidebar: true
#         filename: dashboards/creek_flood_watch.yaml
#
# Stock cards only (gauge / history-graph / entities / markdown / button), styled by the
# Prism theme. Requires the Layer-2 package (ha-packages/creek_modeling.yaml) for the
# creek_* MQTT entities and the creek_modeling add-on to be running. Entities that don't
# exist yet (e.g. sensor.creek_stage before the ESPHome node is live) degrade gracefully.
#
# NOTE: `theme: Prism` assumes that theme is installed under that exact name — adjust or
# remove the theme keys if yours differs.

title: Creek Flood Watch

views:
  # ============================ HOUSEHOLD ==============================
  - title: Flood Watch
    path: flood-watch
    icon: mdi:water-alert
    theme: Prism
    cards:
      - type: markdown
        content: >
          # {{ state_attr('sensor.creek_alert_tier', 'label') or 'Unknown' }}

          **Tier {{ states('sensor.creek_alert_tier') }}** · flood probability
          **{{ states('sensor.creek_flood_probability') }}%**
          ({{ states('sensor.creek_model_method') }} model)

          {% set tier = states('sensor.creek_alert_tier') %}
          {% if tier == '3' %}🚨 Flooding imminent or underway — act now.
          {% elif tier == '2' %}⚠️ Creek is responding to rain — monitor closely.
          {% elif tier == '1' %}👀 Conditions are setting up — keep an eye on it.
          {% else %}✅ No elevated flood risk right now.
          {% endif %}

          _Placeholder thresholds — not yet field-calibrated (open question #7)._

      - type: gauge
        entity: sensor.creek_flood_probability
        name: Flood Probability
        unit: '%'
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 20
          red: 50

      - type: history-graph
        title: Creek Level (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.creek_stage
            name: Stage

      - type: entities
        title: Now
        show_header_toggle: false
        entities:
          - entity: sensor.creek_predicted_crest
            name: Predicted crest
          - entity: sensor.creek_lag_estimate
            name: Lag estimate
          - entity: sensor.creek_soil_moisture_mean
            name: Soil moisture (mean)
          - entity: binary_sensor.creek_soil_ponding
            name: Low-lying ponding

  # ============================ OPERATOR ==============================
  - title: Operator
    path: operator
    icon: mdi:cog
    theme: Prism
    cards:
      # Banner only while the service is mid-task.
      - type: conditional
        conditions:
          - entity: sensor.creek_pipeline_state
            state: running
        card:
          type: markdown
          content: >
            ⏳ **Pipeline running** — task:
            {{ state_attr('sensor.creek_pipeline_state', 'task') }}. Buttons are queued
            single-threaded, so a press now runs after the current task.

      - type: entities
        title: Controls
        show_header_toggle: false
        entities:
          - entity: button.creek_run_inference_now
            name: Run inference now
          - entity: button.creek_retrain_now
            name: Retrain now
          - type: divider
          - entity: button.creek_promote_model
            name: Promote candidate → active
          - entity: button.creek_rollback_model
            name: Rollback to previous
          - type: divider
          - entity: sensor.creek_last_command
            name: Last command
            secondary_info: last-changed

      - type: entities
        title: Pipeline & model status
        show_header_toggle: false
        entities:
          - entity: sensor.creek_pipeline_state
            name: Pipeline state
          - entity: sensor.creek_last_inference
            name: Last inference
          - entity: sensor.creek_last_nightly
            name: Last nightly run
          - type: divider
          - entity: sensor.creek_model_health
            name: Model health
          - entity: sensor.creek_model_method
            name: Active method
          - entity: sensor.creek_dataset_rows
            name: Dataset rows
          - entity: sensor.creek_event_count
            name: Storm events captured
          - entity: sensor.creek_active_model
            name: Active model
          - entity: sensor.creek_candidate_model
            name: Candidate model

      - type: markdown
        title: Model review
        content: >
          ### Active vs candidate

          | Metric | Active | Candidate |
          |---|---|---|
          | Version | {{ states('sensor.creek_active_model') }} | {{ states('sensor.creek_candidate_model') }} |
          {% set a = state_attr('sensor.creek_active_model', 'active_metrics') or {} %}
          {% set c = state_attr('sensor.creek_active_model', 'candidate_metrics') or {} %}
          {% set keys = (a.keys() | list + c.keys() | list) | unique | list %}
          {% for k in keys %}| {{ k }} | {{ a.get(k, '—') }} | {{ c.get(k, '—') }} |
          {% endfor %}

          Use **Promote** to activate the candidate, **Rollback** to restore the
          previous active. (Skill metrics populate once Phase-4 training lands.)

      - type: entities
        title: Ingestion health
        show_header_toggle: false
        entities:
          - entity: sensor.creek_stage
            name: Creek stage
            secondary_info: last-changed
          - entity: sensor.outside_weather_station_soil_moisture_1
            name: Soil — near house
            secondary_info: last-changed
          - entity: sensor.outside_weather_station_soil_moisture_2
            name: Soil — near creek
            secondary_info: last-changed
          - entity: sensor.outside_weather_station_rain_rate
            name: Rain rate
            secondary_info: last-changed
          - entity: sensor.outside_weather_station_daily_rain
            name: Rain today
            secondary_info: last-changed

      - type: entities
        title: Watchdogs
        show_header_toggle: false
        entities:
          - entity: binary_sensor.creek_stage_stale
            name: Creek stage stale
          - entity: binary_sensor.creek_soil_moisture_stale
            name: Soil moisture stale
          - entity: binary_sensor.creek_rain_rate_stale
            name: Rain rate stale
          - entity: binary_sensor.creek_modeling_service_stale
            name: Modeling service stale
