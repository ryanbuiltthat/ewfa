# Home Assistant package — Ackerly Creek flood early-warning (Layer 1, spec §4).
# Load via configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named ha-packages
#
# SCOPE: only the two things that genuinely cannot live in the add-on.
#
# Everything else that used to be here — the soil-moisture mean, the ponding flag, and the
# sensor-fault watchdogs — is now computed by the add-on and auto-provisioned via MQTT
# discovery (spec Addendum B.1a), so it needs no file copied into the HA config directory
# and no configuration.yaml edit. Those entities are also more accurate there: the add-on
# can see when a source last answered and when an input entity last produced a usable
# value, neither of which a template could observe.
#
# ENTITY-ID CONVENTION: add-on entities carry the device-name prefix HA applies to
# MQTT-discovery entities — `sensor.ackerly_creek_modeling_creek_*`. Entities defined in
# THIS file, and the ESPHome creek node, do not: they are plain `sensor.creek_*`.

template:
  - binary_sensor:
      # The one watchdog that cannot move into the add-on: a service cannot report its own
      # death. The add-on publishes pipeline status every fast loop (default 5 min),
      # toggling idle/running, so last_changed tracks liveness. No update in 15 min means
      # it is stopped or wedged. (Its MQTT LWT also flips every discovered entity to
      # unavailable when it disconnects, which covers the common case on its own.)
      - name: "Creek Modeling Service Stale"
        unique_id: creek_modeling_service_stale
        device_class: problem
        state: >
          {% set e = states.sensor.ackerly_creek_modeling_creek_pipeline_state %}
          {{ e is none or e.state in ['unknown', 'unavailable']
             or (now() - e.last_changed).total_seconds() > 900 }}

automation:
  # Tier evaluation lives in the add-on (app/tiers.py) and arrives as
  # sensor.ackerly_creek_modeling_creek_alert_tier. This automation is the HA-side *action*
  # half of spec §6 — it has to be here because it calls persistent_notification.
  #
  # Tier scale: 0 All-clear · 1 Advisory · 2 Watch · 3 Warning · 4 Emergency.
  #
  # DELIBERATELY CONSERVATIVE: notifications only. The escalating actions in spec §6
  # (mobile push, TTS, wake-the-house) are NOT wired up — thresholds are uncalibrated
  # (open questions #5/#7) and §8 requires every wake-the-family action to be dry-run
  # testable first. Add notify targets here once a few storms have validated the tiers.
  - id: creek_tier_change
    alias: "Creek alert tier changed"
    description: >-
      Posts a persistent notification whenever the add-on's alert tier changes, including
      the reason that drove it. Tiers 1-2 are forecast/rainfall driven and work without
      the creek gauge; tiers 3-4 stay dormant until the ESPHome node reports stage.
    triggers:
      - trigger: state
        entity_id: sensor.ackerly_creek_modeling_creek_alert_tier
    conditions:
      # Ignore startup/unavailable churn and the MQTT LWT flipping the entity.
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state != trigger.from_state.state }}
    actions:
      - choose:
          # Back to all-clear: replace the notification rather than leaving a stale alarm.
          - conditions:
              - condition: state
                entity_id: sensor.ackerly_creek_modeling_creek_alert_tier
                state: "0"
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: creek_alert_tier
              - action: persistent_notification.create
                data:
                  notification_id: creek_all_clear
                  title: "Creek all-clear"
                  message: >-
                    Conditions back to normal
                    ({{ now().strftime('%-I:%M %p') }}).
        default:
          - action: persistent_notification.dismiss
            data:
              notification_id: creek_all_clear
          - action: persistent_notification.create
            data:
              notification_id: creek_alert_tier
              title: >-
                Creek {{ state_attr('sensor.ackerly_creek_modeling_creek_alert_tier',
                                    'label') or 'alert' }}
                (Tier {{ states('sensor.ackerly_creek_modeling_creek_alert_tier') }})
              message: >-
                {{ state_attr('sensor.ackerly_creek_modeling_creek_alert_tier', 'why')
                   or 'No reason reported.' }}

                _Thresholds are not yet field-calibrated — verify before acting._
    mode: single
