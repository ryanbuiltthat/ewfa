# Ackerly Creek node — ESP32-C6 + DFRobot SEN0676 80 GHz radar (spec §2, Phase 1).
#
# Publishes `sensor.creek_stage`, which is what the modeling add-on reads
# (`stage_entity` in creek_modeling/config.yaml) and what unlocks alert tiers 3-4.
# Entity IDs are asserted by creek_modeling/tests/test_esphome_entities.py — the device is
# named `creek` and each sensor carries a bare name, so Home Assistant mints
# `sensor.creek_stage` rather than a doubled-up prefix.
#
# See README.md in this directory for wiring, the bench-test procedure, and how to set the
# datum at install. Do not flash this to a pole-mounted node before bench-testing: the
# register map below is transcribed from the datasheet and has never been run against real
# hardware.

substitutions:
  device_name: creek
  friendly_name: Creek

  # --- Wiring (GPIO matrix, so these are a choice, not a constraint) ---------------
  # Avoids the C6 strapping pins (GPIO8/9/15) and the USB-JTAG pair (GPIO12/13).
  uart_tx_pin: GPIO5      # -> sensor RX
  uart_rx_pin: GPIO4      # <- sensor TX
  i2c_sda_pin: GPIO6
  i2c_scl_pin: GPIO7

  # --- Reporting cadence (spec §2: 30-60 s normal, 5-10 s on rapid rise) -----------
  # Kept in ms so the same value serves the poller config and the lambda that retunes it.
  normal_interval_ms: "60000"
  fast_interval_ms: "5000"
  # Rate-of-rise that flips the node into fast reporting, in/min. Deliberately well below
  # the add-on's Tier 3 warning threshold (0.05 in/min, app/tiers.py): the node's job is to
  # already be sampling fast by the time the creek is rising fast enough to alarm.
  fast_threshold_in_min: "0.02"
  # Once tripped, stay fast for this long. Without the hold, a single fast sample flips to
  # 5 s and the next slow one flips straight back, so the mode chatters through exactly the
  # rise it exists to capture.
  fast_hold_ms: "600000"     # 10 min

  # --- Measurement validity -------------------------------------------------------
  blanking_mm: "150"         # datasheet: 0.15 m minimum range; closer than this is noise
  overrange_slack_mm: "1000" # below-datum readings past this are a lost target, not a low creek
  median_window: "5"         # pole sway is level noise (spec §2) — median rejects the swing

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf     # C6 has no usable Arduino core; ESP-IDF is the only option

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The node is on a pole at the creek, reached by the outdoor AP on the back deck (§2).
  # Open question #6 is whether RSSI there is adequate — bag-test before final mount.
  # LIGHT power save is the compromise the solar budget wants; if the link proves marginal
  # at the pole, `none` is the first thing to try.
  power_save_mode: LIGHT
  fast_connect: true
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret ap_password

captive_portal:

# --- Buses -------------------------------------------------------------------------
uart:
  - id: radar_uart
    tx_pin: ${uart_tx_pin}
    rx_pin: ${uart_rx_pin}
    # Datasheet default. Its worked example changes 115200 -> 9600 by writing 0x60 to
    # register 0x03F6 (baud/100), so a sensor that has been reconfigured will need this
    # changed to match. Format is fixed at 8N1.
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

modbus:
  - id: radar_bus
    uart_id: radar_uart

modbus_controller:
  - id: radar
    modbus_id: radar_bus
    address: 1              # datasheet default; changeable via register 0x03F4
    update_interval: ${normal_interval_ms}ms
    setup_priority: -10

# --- State ------------------------------------------------------------------------
globals:
  - id: last_stage_ft
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: last_sample_ms
    type: uint32
    restore_value: false
    initial_value: '0'
  - id: fast_until_ms
    type: uint32
    restore_value: false
    initial_value: '0'

# --- Calibration -------------------------------------------------------------------
number:
  # The datum (open question #5) is not surveyed yet, and this is why the node reads raw
  # distance rather than the sensor's own "water level" register: that register derives
  # from an installation height stored in *centimetres*, which would quantise a ±5 mm
  # sensor to 1 cm. Keeping the conversion here also means the datum is re-settable from
  # Home Assistant at install, with no reflash and nothing written to the sensor's flash.
  - platform: template
    id: mount_height_mm
    name: Mount Height Above Datum
    icon: mdi:arrow-expand-vertical
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "3000"     # ~9.8 ft, the §2 target — a placeholder until surveyed
    min_value: 500
    max_value: 6000
    step: 1
    unit_of_measurement: mm
    mode: box

# --- Sensors -----------------------------------------------------------------------
sensor:
  # Register 0x0001 "empty height": radar face -> water surface, in mm, already filtered
  # on-module. Function code 0x03 = holding register.
  - platform: modbus_controller
    modbus_controller_id: radar
    id: radar_distance_mm
    name: Radar Distance
    entity_category: diagnostic
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    unit_of_measurement: mm
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - median:
          window_size: ${median_window}
          send_every: 1
          send_first_at: 3
    on_value:
      then:
        - lambda: |-
            const float mount = id(mount_height_mm).state;
            const float d = x;
            // A lost target reads as an implausible distance rather than an error, so an
            // unvalidated reading would publish a confident wrong stage.
            if (isnan(mount) || d < ${blanking_mm} || d > mount + ${overrange_slack_mm}) {
              ESP_LOGW("creek", "distance %.0f mm out of range — stage unavailable", d);
              id(stage).publish_state(NAN);
              return;
            }
            const float ft = (mount - d) / 304.8f;
            id(stage).publish_state(ft);

            const uint32_t now = millis();
            if (!isnan(id(last_stage_ft)) && id(last_sample_ms) != 0) {
              const float dt_min = (now - id(last_sample_ms)) / 60000.0f;
              if (dt_min > 0.03f) {          // ignore sub-2 s gaps; the ratio gets noisy
                const float ror = (ft - id(last_stage_ft)) * 12.0f / dt_min;
                id(rate_of_rise).publish_state(ror);
                if (ror >= ${fast_threshold_in_min}) {
                  id(fast_until_ms) = now + ${fast_hold_ms};
                }
                // Retune the poller, not a publish filter: the point of fast mode is to
                // *sample* the crest, and a reading never taken cannot be recovered.
                // Signed compare so the millis() wrap at ~49 days cannot strand the node
                // in fast mode until it reboots.
                const bool fast = (int32_t)(id(fast_until_ms) - now) > 0;
                const uint32_t want = fast ? ${fast_interval_ms} : ${normal_interval_ms};
                if (id(radar).get_update_interval() != want) {
                  id(radar).stop_poller();
                  id(radar).set_update_interval(want);
                  id(radar).start_poller();
                  ESP_LOGI("creek", "poll interval -> %u ms", want);
                }
                id(last_stage_ft) = ft;
                id(last_sample_ms) = now;
              }
            } else {
              id(last_stage_ft) = ft;
              id(last_sample_ms) = now;
            }

  # The ground truth. Feet above the low-water datum; bank top is +3 ft (spec §2).
  - platform: template
    id: stage
    name: Stage
    unit_of_measurement: ft
    accuracy_decimals: 2
    device_class: distance
    state_class: measurement
    icon: mdi:waves
    update_interval: never    # published from the radar handler above

  - platform: template
    id: rate_of_rise
    name: Rate of Rise
    unit_of_measurement: in/min
    accuracy_decimals: 3
    state_class: measurement
    icon: mdi:trending-up
    update_interval: never

  # SparkFun LiPo fuel gauge (§2). The max17043 platform also drives the MAX17048 that
  # newer SparkFun boards carry; both answer at 0x36.
  - platform: max17043
    battery_voltage:
      name: Battery Voltage
      entity_category: diagnostic
    battery_level:
      name: Battery Level
      entity_category: diagnostic

  - platform: wifi_signal
    name: WiFi Signal
    entity_category: diagnostic
    update_interval: 300s

  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    update_interval: 300s

binary_sensor:
  # Surfaces that the node noticed a rise and sped up, which is otherwise invisible until
  # someone reads the logs.
  - platform: template
    name: Fast Reporting
    entity_category: diagnostic
    icon: mdi:run-fast
    lambda: |-
      return (int32_t)(id(fast_until_ms) - millis()) > 0;

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
